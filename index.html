<!DOCTYPE html>
<html>
<body>

<h1 id="here">Please wait...</h1>

<script>
const el = document.getElementById("here");

const ws = new WebSocket("wss://iot-server-yp8e.onrender.com");

ws.onmessage = (e) => {
  const data = JSON.parse(e.data);
  if (data.type === "payload") {
    el.innerText = data.value;
  }
};
</script>

</body>
</html>
